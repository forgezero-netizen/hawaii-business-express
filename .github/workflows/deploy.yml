name: Deploy Hawaii Business Express

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "content/**"
      - "scripts/**"
      - "asset_sources/**"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: hawaii-business-express-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install article build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build and validate articles
        run: python scripts/build_articles.py

      - name: Restore and validate approved Articles banner
        run: python scripts/build_banner_asset.py

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy site over FTPES
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -p 21 -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" <<'LFTP'
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes

          mirror --reverse --verbose --only-newer \
            --exclude-glob .well-known/ \
            --exclude-glob cgi-bin/ \
            --exclude-glob .ftpquota \
            ./site/ /

          # /articles/ is build-managed. Delete stale generated article folders
          # without touching manually uploaded assets elsewhere on the site.
          mirror --reverse --verbose --only-newer --delete \
            ./site/articles/ /articles/

          bye
          LFTP

      - name: Verify deployed article system
        run: python scripts/verify_deployment.py

      - name: Validate deployed hero image binaries
        run: python scripts/verify_images.py

      - name: Verify live Articles banner and image integrity
        run: python scripts/verify_articles_banner.py
