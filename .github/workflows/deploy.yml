name: Deploy Hawaii Business Express

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
  workflow_dispatch:

concurrency:
  group: hawaii-business-express-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy site over FTPES
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -p 21 -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" <<'LFTP'
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          mirror --reverse --verbose --only-newer \
            --exclude-glob .well-known/ \
            --exclude-glob cgi-bin/ \
            --exclude-glob .ftpquota \
            ./site/ /
          bye
          LFTP
