<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hawaiʻi Annual Report Requirements</title>
  <desc id="desc">A branded illustration showing Diamond Head, the ocean, an annual report checklist, and quarterly filing deadlines.</desc>
  <defs>
