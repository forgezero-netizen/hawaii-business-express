  <rect x="70" y="70" width="685" height="420" rx="28" fill="url(#panel)" filter="url(#shadow)"/>
  <text x="120" y="135" fill="#d8a23d" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">MANAGING A BUSINESS</text>
