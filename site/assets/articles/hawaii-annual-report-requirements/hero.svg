  <text x="120" y="245" fill="#ffffff" font-family="Arial, sans-serif" font-size="72" font-weight="800">Hawaiʻi Annual Report</text>
  <text x="120" y="325" fill="#8bd8dd" font-family="Arial, sans-serif" font-size="72" font-weight="800">Requirements</text>
  <text x="120" y="385" fill="#dce8eb" font-family="Arial, sans-serif" font-size="28">Quarter-based deadlines • filing basics • good standing</text>
  <text x="120" y="440" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" letter-spacing="3">STAY CURRENT. STAY COMPLIANT.</text>

